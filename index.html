<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pokémon's World</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="page">
    <!-- HEADER -->
    <header class="header">
      <div class="header-container">
        <!-- Logo -->
        <div class="brand">
          <div class="pokeball"></div>

          <div>
            <h1>Pokémon's World</h1>

            <span> POKÉDEX SYSTEM </span>
          </div>
        </div>

        <!-- Header navigation -->
        <nav class="header-nav">
          <a href="#" class="active"> Home </a>

          <a href="#"> Pokédex </a>

          <a href="#"> Types </a>

          <a href="#"> History </a>

          <a href="#"> Links </a>
        </nav>

        <!-- Music -->
        <button class="music-button">▶ Disconnect music</button>
      </div>
    </header>

    <!-- PAGE LAYOUT -->
    <div class="page-layout">
      <!-- LEFT: NAVIGATION -->
      <aside class="left-sidebar">
        <div class="navigation-panel">
          <p class="panel-title">SYSTEM NAVIGATION</p>

          <nav class="side-nav">
            <a href="#" class="active"> Home </a>

            <a href="#"> Pokédex </a>

            <a href="#"> Pokémon Types </a>

            <a href="#"> Pokémon History </a>

            <a href="#"> Links </a>
          </nav>
        </div>
      </aside>

      <!-- CENTER: MAIN CONTENT -->
      <main class="main-content">
        <section class="content-panel">
          <p class="panel-title">MAIN CONTENT</p>

          <h2>Pokémon's World</h2>

          <div class="content-placeholder">
            <span> MAIN CONTENT AREA </span>
          </div>
        </section>
      </main>

      <!-- RIGHT: SIDEBAR / ADS -->
      <aside class="right-sidebar">
        <div class="sidebar-panel">
          <p class="panel-title">SIDEBAR / ADS</p>

          <div class="sidebar-placeholder">
            <span> SIDEBAR / ADS AREA </span>
          </div>
        </div>
      </aside>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-container">
        <span> Pokémon's World </span>

        <span> © 2026 Pokémon's World </span>
      </div>
    </footer>
    <script type="module" src="js/script.js"></script>
  </body>
</html>
